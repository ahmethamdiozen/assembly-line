# Geliştirme için "fabrika" SQL Server'ı. Gerçek sistemde bu servis yerine fabrikanın SQL Server'ı kullanılır.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # Apple Silicon'da Rosetta ile çalışır
    container_name: tm50-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Tm50!Assembly2026}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - tm50-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  tm50-mssql-data:
